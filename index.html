<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval PDWs - Messer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root { --bg: #f5f7fa; --card: #ffffff; --muted: #7f8c8d; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background: var(--bg); color: var(--text); }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .filter-section { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 15px; }
        .filter-section input, .filter-section select { padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; flex: 1; min-width: 200px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--card); border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
        .card:focus { outline: 3px solid #c7e1ff; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .card-media { height: 220px; background: #eaeded; position: relative; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }
        .card-media img, .card-media model-viewer { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .card-content { padding: 20px; flex-grow: 1; }
        .card-title { margin: 0 0 10px 0; font-size: 18px; color: #2c3e50; }
        .card-meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal[aria-hidden="true"] { pointer-events: none; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); width: 100%; max-width: 1000px; max-height: 90vh; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 30px; background: none; border: none; color: var(--text); cursor: pointer; z-index: 1010; }
        .modal-body { display: flex; flex-direction: column; overflow-y: auto; }
        @media (min-width: 768px) { .modal-body { flex-direction: row; } }
        .modal-media-container { flex: 0 0 auto; background: #000; min-height: 350px; width: 100%; position: relative; display: flex; justify-content: center; align-items: center; color: #fff; }
        @media (min-width: 768px) { .modal-media-container { width: 40%; min-height: 400px; } }
        .modal-media-container img { max-width: 100%; max-height: 450px; object-fit: contain; }
        model-viewer { width: 100%; height: 400px; background-color: #1a1a1a; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.7); border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; }
        .nav-btn:hover { background: white; }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }
        .modal-info { flex: 1; padding: 30px; overflow-y: auto; background: var(--card); }
        .modal-info h2 { margin-top: 0; color: #2c3e50; }
        .modal-info h3 { margin: 24px 0 8px; color: #2c3e50; font-size: 16px; text-decoration: underline; }
        .modal-info > p { margin: 10px 0 20px 0; color: var(--text); }
        .specs-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .specs-table tr { border-bottom: 1px solid #eee; }
        .specs-table td { padding: 12px 0; font-size: 14px; }
        .specs-table td.td-label { font-weight: bold; color: #2c3e50; width: 35%; vertical-align: top; }
        .specs-table td:last-child { word-break: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Medieval PDWs - Messer</h1>
        <div class="filter-section">
            <input type="text" id="searchInput" placeholder="Search...">
            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Bauernwehr">Bauernwehr</option>
                <option value="Langes Messer">Langes Messer</option>
                <option value="Grosses Messer">Grosses Messer</option>
            </select>
            <select id="typeFilter">
                <option value="">All Types</option>
                <option value="placeholder 1">placeholder 1</option>
                <option value="placeholder 2">placeholder 2</option>
                <option value="placeholder 3">placeholder 3</option>
                <option value="placeholder 4">placeholder 4</option>
                <option value="placeholder 5">placeholder 5</option>
            </select>
        </div>
        <div class="grid" id="objectGrid" aria-live="polite"></div>
    </div>
    <div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-content">
            <button class="close-btn" id="modalCloseBtn" aria-label="Close details">&times;</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>
    <script>
        function svgDataUri(svgString) { return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svgString); }
        function createFallbackPreview(width = 300, height = 220, bg = '#eaeded', text = 'No image') {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><rect width="100%" height="100%" fill="${bg}"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#7f8c8d" font-size="16">${text}</text></svg>`;
            return svgDataUri(svg);
        }

        let allObjects = [], currentMediaIndex = 0, currentMediaList = [], lastFocusedElement = null;
        const grid = document.getElementById('objectGrid');
        document.getElementById('searchInput').addEventListener('input', filterObjects);
        document.getElementById('categoryFilter').addEventListener('change', filterObjects);
        document.getElementById('typeFilter').addEventListener('change', filterObjects);
        grid.addEventListener('click', e => { const card = e.target.closest('.card'); if (card) openModal(Number(card.dataset.id)); });
        grid.addEventListener('keydown', e => { const card = e.target.closest('.card'); if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openModal(Number(card.dataset.id)); } });

        fetch('database.json').then(res => { if (!res.ok) throw new Error('Failed to load data'); return res.json(); }).then(data => { allObjects = Array.isArray(data) ? data : []; renderGrid(allObjects); }).catch(err => { console.error(err); grid.innerHTML = '<p style="text-align:center;width:100%;color:#7f8c8d;">Unable to load object data.</p>'; });

        function renderGrid(objects) {
            grid.innerHTML = '';
            if (!objects.length) { grid.innerHTML = '<p style="text-align:center;width:100%;color:#7f8c8d;">No matching items found.</p>'; return; }
            objects.forEach(obj => {
                const card = document.createElement('div'); card.className = 'card'; card.tabIndex = 0; card.dataset.id = obj.id;
                const media = document.createElement('div'); media.className = 'card-media';
                const img = document.createElement('img'); img.loading = 'lazy'; img.alt = obj.name || 'Object';
                img.src = Array.isArray(obj.photo) && obj.photo.length && String(obj.photo[0]).trim() ? obj.photo[0] : createFallbackPreview();
                media.appendChild(img);
                const content = document.createElement('div'); content.className = 'card-content'; content.innerHTML = '<h3 class="card-title"></h3><div class="card-meta"></div>';
                content.querySelector('.card-title').textContent = obj.name || 'Unnamed';
                content.querySelector('.card-meta').textContent = `${obj.category || '-'} | ${obj.type || '-'}`;
                card.append(media, content); grid.appendChild(card);
            });
        }

        function filterObjects() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const type = document.getElementById('typeFilter').value;
            renderGrid(allObjects.filter(obj => {
                const matchesKeyword = String(obj.name || '').toLowerCase().includes(keyword) || String(obj.description || '').toLowerCase().includes(keyword);
                const matchesCategory = !category || obj.category === category;
                const matchesType = !type || obj.type === type;
                return matchesKeyword && matchesCategory && matchesType;
            }));
        }

        function appendRows(table, fields, obj) {
            fields.forEach(([key, label]) => {
                const value = obj[key];
                if (value === undefined || value === null || String(value).trim() === '') return;
                const row = document.createElement('tr');
                row.innerHTML = '<td class="td-label"></td><td></td>';
                row.children[0].textContent = label;
                row.children[1].textContent = String(value);
                table.appendChild(row);
            });
        }

        function openModal(id) {
            const obj = allObjects.find(item => item.id === id); if (!obj) return;
            lastFocusedElement = document.activeElement; currentMediaList = [];
            if (obj.modell3d && String(obj.modell3d).trim()) currentMediaList.push({ type: '3d', src: obj.modell3d });
            if (Array.isArray(obj.photo)) obj.photo.filter(p => p && String(p).trim()).forEach(p => currentMediaList.push({ type: 'image', src: String(p) }));
            if (!currentMediaList.length) currentMediaList.push({ type: 'image', src: createFallbackPreview(450, 450, '#1a1a1a', 'No media available') });
            currentMediaIndex = 0;

            const body = document.getElementById('modalBody');
            body.innerHTML = '<div class="modal-media-container" id="modalMediaViewport"></div><div class="modal-info"><h2></h2><p></p><h3 class="general-heading">General Information</h3><table class="specs-table general-table"></table><h3>Dimensions</h3><table class="specs-table dimensions-table"></table></div>';
            body.querySelector('h2').textContent = obj.name || 'Unnamed Object';
            body.querySelector('p').textContent = obj.description || 'No description available.';

            appendRows(body.querySelector('.general-table'), [
                ['name', 'Name'],
                ['altname', 'Alternate Name'],
                ['category', 'Category'],
                ['type', 'Type'],
                ['date', 'Date'],
                ['currentlocation', 'Current Location'],
                ['weight', 'Weight'],
                ['pointofbalance', 'Point of Balance']
            ], obj);

            appendRows(body.querySelector('.dimensions-table'), [
                ['length', 'Length'],
                ['bladelenght', 'Blade Length'],
                ['falseedgelength', 'False Edge Length'],
                ['bladewidth', 'Blade Width'],
                ['guardlength', 'Guard Length'],
                ['depthnailring', 'Depth Nail/Ring'],
                ['distal taper', 'Distal Taper'],
                ['pommelcapdimensions', 'Pommel Cap'],
                ['grip', 'Grip']
            ], obj);

            updateMediaViewport();
            const modal = document.getElementById('detailModal');
            modal.classList.add('active'); modal.setAttribute('aria-hidden', 'false');
            document.getElementById('modalCloseBtn').focus();
            document.addEventListener('keydown', modalKeyHandler);
        }

        window.openModal = openModal;

        function updateMediaViewport() {
            const viewport = document.getElementById('modalMediaViewport'); if (!viewport) return;
            viewport.innerHTML = ''; const media = currentMediaList[currentMediaIndex];
            if (media.type === '3d') {
                const viewer = document.createElement('model-viewer'); viewer.src = media.src;
                viewer.setAttribute('camera-controls', ''); viewer.setAttribute('auto-rotate', ''); viewport.appendChild(viewer);
            } else { const img = document.createElement('img'); img.src = media.src; img.alt = 'Gallery'; viewport.appendChild(img); }
            if (currentMediaList.length > 1) {
                ['prev', 'next'].forEach((direction, i) => {
                    const btn = document.createElement('button'); btn.className = `nav-btn ${direction}-btn`; btn.type = 'button'; btn.textContent = direction === 'prev' ? '←' : '→'; btn.setAttribute('aria-label', direction === 'prev' ? 'Previous image' : 'Next image'); btn.addEventListener('click', () => changeMedia(direction === 'prev' ? -1 : 1));
                    viewport.appendChild(btn);
                });
            }
        }

        function changeMedia(direction) { currentMediaIndex = (currentMediaIndex + direction + currentMediaList.length) % currentMediaList.length; updateMediaViewport(); }
        function closeModal() { const modal = document.getElementById('detailModal'); modal.classList.remove('active'); modal.setAttribute('aria-hidden', 'true'); document.removeEventListener('keydown', modalKeyHandler); if (lastFocusedElement) lastFocusedElement.focus(); }
        function modalKeyHandler(e) { if (e.key === 'Escape') closeModal(); if (e.key === 'ArrowLeft') changeMedia(-1); if (e.key === 'ArrowRight') changeMedia(1); }
        document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
        document.getElementById('detailModal').addEventListener('click', e => { if (e.target.id === 'detailModal') closeModal(); });
    </script>
</body>
</html>
