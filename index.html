<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Object Collection</title>
    <!-- Load Google's 3D Viewer Script -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background: #f5f7fa; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        
        /* Filter Panel */
        .filter-section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 15px; }
        .filter-section input, .filter-section select { padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; flex: 1; min-width: 200px; }
        
        /* Grid and Card Styles */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .card-media { height: 220px; background: #eaeded; position: relative; }
        .card-media img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { margin: 0 0 10px 0; font-size: 18px; color: #2c3e50; }
        .card-meta { font-size: 13px; color: #7f8c8d; margin-bottom: 10px; }
        
        /* Modal (Popup View) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 900px; max-height: 90vh; border-radius: 16px; overflow-y: auto; display: flex; flex-direction: column; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 30px; background: none; border: none; color: #333; cursor: pointer; z-index: 1010; }
        
        .modal-body { display: flex; flex-direction: column; }
        @media(min-width: 768px) { .modal-body { flex-direction: row; } }
        
        .modal-media-container { flex: 1; background: #000; min-height: 350px; position: relative; display: flex; justify-content: center; align-items: center; }
        .modal-media-container img { max-width: 100%; max-height: 450px; object-fit: contain; }
        model-viewer { width: 100%; height: 450px; background-color: #1a1a1a; }
        
        /* Gallery Arrows */
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.7); border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 1005; }
        .nav-btn:hover { background: white; }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }
        
        /* Specs Table */
        .modal-info { flex: 1; padding: 30px; overflow-y: auto; }
        .specs-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .specs-table td { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .specs-table td.td-label { font-weight: bold; color: #7f8c8d; width: 40%; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Global Object Collection</h1>

        <div class="filter-section">
            <input type="text" id="searchInput" placeholder="Search..." oninput="filterObjects()">
            <select id="categoryFilter" onchange="filterObjects()">
                <option value="">All Categories</option>
                <option value="Edged Weapons">Edged Weapons</option>
                <option value="Armor">Armor</option>
            </select>
            <select id="typeFilter" onchange="filterObjects()">
                <option value="">All Types</option>
                <option value="Sword">Sword</option>
                <option value="Helmet">Helmet</option>
            </select>
        </div>

        <div class="grid" id="objectGrid"></div>
    </div>

    <div class="modal" id="detailModal" onclick="closeModalOnOutsideClick(event)">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        let allObjects = [];
        let currentMediaIndex = 0;
        let currentMediaList = [];

        fetch('datenbank.json')
            .then(res => res.json())
            .then(data => {
                allObjects = data;
                renderGrid(allObjects);
            }).catch(err => console.error(err));

        function renderGrid(objects) {
            const grid = document.getElementById('objectGrid');
            grid.innerHTML = '';
            if(objects.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%; color:#7f8c8d;">No matching items found.</p>';
                return;
            }
            objects.forEach(obj => {
                let previewPhoto = 'https://placeholder.com';
                if (obj.photo && Array.isArray(obj.photo) && obj.photo.length > 0) previewPhoto = obj.photo[0];
                else if (obj.photo && typeof obj.photo === 'string' && obj.photo.trim() !== '') previewPhoto = obj.photo;

                grid.innerHTML += `
                    <div class="card" onclick="openModal(${obj.id})">
                        <div class="card-media"><img src="${previewPhoto}" alt="${obj.name || 'Object'}" loading="lazy"></div>
                        <div class="card-content">
                            <div>
                                <h3 class="card-title">${obj.name || 'Unnamed'}</h3>
                                <div class="card-meta"><strong>${obj.category || '-'}</strong> | ${obj.type || '-'}</div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function filterObjects() {
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const selectedCategory = document.getElementById('categoryFilter').value;
            const selectedType = document.getElementById('typeFilter').value;

            const filtered = allObjects.filter(obj => {
                const nameMatch = obj.name ? obj.name.toLowerCase().includes(searchKeyword) : false;
                const descMatch = obj.description ? obj.description.toLowerCase().includes(searchKeyword) : false;
                return (nameMatch || descMatch) && (selectedCategory === "" || obj.category === selectedCategory) && (selectedType === "" || obj.type === selectedType);
            });
            renderGrid(filtered);
        }

        function openModal(id) {
            const obj = allObjects.find(item => item.id === id);
            if(!obj) return;

            currentMediaList = [];
            if(obj.modell3d && obj.modell3d.trim() !== "") currentMediaList.push({ type: '3d', src: obj.modell3d });
            
            if(obj.photo && Array.isArray(obj.photo)) {
                obj.photo.forEach(img => { if(img.trim() !== "") currentMediaList.push({ type: 'image', src: img }); });
            } else if(obj.photo && typeof obj.photo === 'string' && obj.photo.trim() !== "") {
                currentMediaList.push({ type: 'image', src: obj.photo });
            }

            if(currentMediaList.length === 0) currentMediaList.push({ type: 'image', src: 'https://placeholder.com' });
            currentMediaIndex = 0;
            
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="modal-media-container" id="modalMediaViewport"></div>
                <div class="modal-info">
                    <h2>${obj.name || 'Unnamed Object'}</h2>
                    <p>${obj.description || 'No description available.'}</p>
                    <table class="specs-table">
                        <tr><td class="td-label">Category</td><td>${obj.category || '-'}</td></tr>
                        <tr><td class="td-label">Type</td><td>${obj.type || '-'}</td></tr>
                        <tr><td class="td-label">Date</td><td>${obj.date || '-'}</td></tr>
                        <tr><td class="td-label">Location</td><td>${obj.currentlocation || '-'}</td></tr>
                        <tr><td class="td-label">Weight</td><td>${obj.weight || '-'}</td></tr>
                        <tr><td class="td-label">Length</td><td>${obj.length || '-'}</td></tr>
                    </table>
                </div>`;

            updateMediaViewport();
            document.getElementById('detailModal').classList.add('active');
        }

        function updateMediaViewport() {
            const viewport = document.getElementById('modalMediaViewport');
            const media = currentMediaList[currentMediaIndex];
            let htmlContent = media.type === '3d' 
                ? `<model-viewer src="${media.src}" camera-controls touch-action="pan-y" auto-rotate></model-viewer>` 
                : `<img src="${media.src}" alt="Gallery">`;

        if (currentMediaList.length > 1) {
            htmlContent += `<button class="nav-btn prev-btn" onclick="changeMedia(-1, event)">&lt;</button>`;
            htmlContent += `<button class="nav-btn next-btn" onclick="changeMedia(1, event)">&gt;</button>`;
        }
        viewport.innerHTML = htmlContent;
    }

    function changeMedia(direction, event) {
        event.stopPropagation();
        currentMediaIndex += direction;
        
        if (currentMediaIndex >= currentMediaList.length) currentMediaIndex = 0;
        if (currentMediaIndex < 0) currentMediaIndex = currentMediaList.length - 1;
        
        updateMediaViewport();
    }

    function closeModal() {
        document.getElementById('detailModal').classList.remove('active');
        const vp = document.getElementById('modalMediaViewport');
        if (vp) vp.innerHTML = '';
    }

    function closeModalOnOutsideClick(event) {
        if (event.target.id === 'detailModal') {
            closeModal();
        }
    }
